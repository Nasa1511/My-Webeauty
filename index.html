<body style="background-color: rgb(235, 203, 225);">

    <nav>

        <li><i><a href="#about">Über mich</a></li>
        <li><a href="#gallery">Galerie</a></li>
        <li><a href="#contact">Kontakt</a></li>
      </ul>
    </nav>

  </header>
  <!-- Abschnitt "Über mich" -->
  <section id="about">

    <h2>Über mich</h2>

    <p>Ich bin eine Webentwicklerin die Beauty-Produkte verkauft!</p>
  </section>

  <!-- Abschnitt "Galerie" -->
  <section id="gallery">
    <h2>Galerie</h2>
    <div class="gallery">
      <div>

        <img src="bilder/Koreanische Kosmetik.webp" alt="Bild 1">
        <img src="bilder/images (1).jpg" alt="Bild 2">
      </div>
      <div>
        <img src="bilder/face_makeup_category_mobile.jpg" alt=" Bild 4">
        <img src="bilder/images (2).jpg" alt="Bild 3">
      </div>
      <div>
        <img src="bilder/images (3).jpg" alt="Bild 5">
        <img src="bilder/images (4).jpg" alt="Bild 6">
      </div>
      <br>
      
    </div>
    <h1 style="text-align: center;">Mein Tolles Video:</h1>
    <div class="video">
      <iframe width="660" height="415" src="https://www.youtube.com/embed/pFMEKnInWpk?si=aELtMW1A-FlmLivO"
        title="YouTube video player" frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>
  </section>

  <!-- Abschnitt "Kontakt" -->
 
  <!-- Fußbereich -->
  <footer>
     <section id="contact">
    <h2>Kontakt</h2>
    <form action="/submit">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required>

      <label for="email">E-Mail:</label>
      <input type="email" id="email" name="email" required>
      <br>
      <label for="message">Nachricht:</label>
      <input id="message" name="message" required>
     
    </form>
  </section>
    <p>© 2026 Meine Erste Webseite</p>
  </footer>
